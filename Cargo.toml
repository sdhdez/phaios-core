[package]
name = "phaios-core"
version = "0.2.0-dev"
edition = "2024"
description = "Numerical kernels for black-and-white RAW image processing"
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/sdhdez/phaios-core"
keywords = ["image-processing", "black-and-white", "photography", "pyo3"]
categories = ["multimedia::images", "science"]
# What must never ship in the published crate or the sdist (which mirrors
# `cargo package`). Git-tracked files bypass .gitignore, so this list is
# the last line of defence against a `git add -f`.
exclude = [
    # The dev tool under tools/ (own lockfile, GUI deps).
    "tools/",
    # Claude Code's project directory, local scratch, and repo-local
    # tooling that lives in the working tree only.
    ".claude/",
    ".cache/",
    "claude-md-templates/",
    "design-briefs/",
    "phaios-core.code-workspace",
    # Contributor and agent instructions, not consumer documentation:
    # the working agreement, local scratch conventions, and pointers to
    # the release runbook. Public on GitHub, where contributors find it.
    "CLAUDE.md",
    # Image assets are never committed (CONTRIBUTING.md, "Examples"):
    # the same bracket-class patterns as .gitignore, case-insensitive by
    # construction, matching at any depth.
    "*.[Dd][Nn][Gg]",
    "*.[Nn][Ee][Ff]",
    "*.[Cc][Rr]2",
    "*.[Cc][Rr]3",
    "*.[Aa][Rr][Ww]",
    "*.[Rr][Aa][Ff]",
    "*.[Oo][Rr][Ff]",
    "*.[Rr][Ww]2",
    "*.[Pp][Ee][Ff]",
    "*.[Ss][Rr][Ww]",
    "*.[Jj][Pp][Gg]",
    "*.[Jj][Pp][Ee][Gg]",
    "*.[Pp][Nn][Gg]",
    "*.[Tt][Ii][Ff]",
    "*.[Tt][Ii][Ff][Ff]",
    "*.[Ww][Ee][Bb][Pp]",
    "*.[Hh][Ee][Ii][Cc]",
    "*.[Hh][Ee][Ii][Ff]",
    "*.[Bb][Mm][Pp]",
    "*.[Gg][Ii][Ff]",
    "*.[Ee][Xx][Rr]",
    "*.[Hh][Dd][Rr]",
    "*.[Pp][Gg][Mm]",
    "*.[Pp][Bb][Mm]",
    "*.[Pp][Pp][Mm]",
    "*.[Pp][Ss][Dd]",
]

[lib]
name = "phaios_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# licence: MIT OR Apache-2.0  source: https://github.com/PyO3/pyo3
# PyO3 bindings to the Python interpreter. abi3-py312 builds a stable-ABI
# wheel compatible with CPython 3.12+.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"] }

# licence: BSD-2-Clause  source: https://github.com/PyO3/rust-numpy
# (NOT MIT OR Apache-2.0, as this line said until it was checked against
# `cargo metadata`. BSD-2-Clause is permissive and GPLv3-compatible.)
# PyO3-based bindings for the NumPy C-API; provides PyReadonlyArray3 / PyArray3.
numpy = "0.29"

# licence: MIT OR Apache-2.0  source: https://github.com/rust-ndarray/ndarray
# N-dimensional array library. Must match the version that the `numpy` crate
# uses (currently 0.17 as of numpy 0.29) to avoid type incompatibilities at
# the FFI boundary. The `rayon` feature enables Zip::par_for_each.
ndarray = { version = "0.17", features = ["rayon"] }

# licence: MIT OR Apache-2.0  source: https://github.com/rayon-rs/rayon
# Data parallelism via work-stealing thread pool. Kernels reach it through
# `ndarray::Zip::par_for_each` and `ndarray::parallel::prelude`, which the
# `rayon` feature of ndarray enables; the direct dependency is kept because
# v0.2's grain kernel generates noise tiles with rayon's own iterators.
rayon = "1"

# licence: MIT OR Apache-2.0  source: https://github.com/dtolnay/thiserror
# Derive macro for std::error::Error; used to define PhaiosError.
thiserror = "2"

# licence: MIT OR Apache-2.0  source: https://github.com/chelsea0x3b/cudarc
# transitive: pulls `libloading` (ISC) for the `dynamic-loading` feature.
# ISC is permissive and GPLv3-compatible; noted here because §6 asks for
# the licence of what a dependency actually brings in, not just its own.
# maintainer: single primary author (75% of commits); #3 contributor is a
# HuggingFace engineer, and Candle + cubecl-cuda build on this crate.
# justification: safe host-side CUDA driver-API bindings for the optional
# `cuda` feature. Chosen over hand-rolled FFI for its versioned symbol
# resolution (cuMemAlloc_v2 etc.), where a mistake is silent memory
# corruption. `dynamic-loading` dlopens libcuda at runtime, so a
# CUDA-enabled build carries no DT_NEEDED on libcuda and imports cleanly
# on machines with no NVIDIA driver. Feature floor cuda-12000: every
# entry point we use predates CUDA 12 by a decade, and a 12.0 API
# surface keeps older user drivers viable. Exit strategy documented in
# src/cuda/context.rs (13 entry points, replaceable via dlopen +
# cuGetProcAddress in days if this crate is ever abandoned).
cudarc = { version = "0.19.9", optional = true, default-features = false, features = [
    "std",
    "driver",
    # nvrtc: needed only because cudarc's `load_module` takes the `Ptx`
    # wrapper type gated behind this feature. `Ptx::from_src` is a plain
    # data wrapper; libnvrtc itself is dlopened lazily on first *use*,
    # and this crate never calls the compile API — PTX is prebuilt by
    # build.rs. No runtime dependency is added.
    "nvrtc",
    "dynamic-loading",
    "cuda-12000",
] }

[features]
default = []
# Optional NVIDIA CUDA backend. Off by default: published wheels stay
# CPU-only and the ordinary dependency graph is unchanged. Building with
# this feature requires nvcc (CUDA toolkit) at build time; running
# requires only the NVIDIA driver, and machines without one degrade
# gracefully (gpu.available() == False).
cuda = ["dep:cudarc"]

[dev-dependencies]
# licence: Apache-2.0 OR MIT  source: https://github.com/bheisler/criterion.rs
# Statistics-driven micro-benchmarking library.
criterion = { version = "0.8", features = ["html_reports"] }

# licence: MIT OR Apache-2.0  source: https://github.com/proptest-rs/proptest
# maintainer: the proptest-rs organisation.
# justification: strategies and shrinking over the shared `validate*`
# functions' whole input domain, which the hand-picked cases in
# tests/kernels.rs and the #[cfg(test)] modules cannot cover by construction.
# Dev-only: exercised by `tests/properties.rs`, never a runtime dependency of
# the published crate or wheel.
proptest = "1"

[[bench]]
name = "kernels"
harness = false

# The CUDA backend, benchmarked on the same 24 MP image. Skips with a
# message when built without `cuda` or run without a device, so a plain
# `cargo bench` on any machine still succeeds.
[[bench]]
name = "gpu"
harness = false

