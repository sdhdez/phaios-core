name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt
        run: cargo fmt --check

      # --all-targets so examples, benches and tests are linted too. Without
      # it, dead code in examples/shared/mod.rs slipped through CI.
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      # CLAUDE.md §2: kernels are pure functions and the CUDA backend holds
      # no implicit state — the device, stream and module cache live in a
      # Context the caller constructs and passes. Comment lines are stripped
      # before matching: context.rs documents the rule by naming the very
      # constructs it forbids ("There is no singleton, no `OnceLock`...").
      - name: No implicit state in the CUDA backend
        run: |
          HITS=$(grep -rnE 'static mut|OnceLock|OnceCell|lazy_static!|thread_local!' src/cuda/ \
                 | grep -vE '^[^:]*:[0-9]+: *(//|/\*|\*)' || true)
          if [ -n "$HITS" ]; then
            echo "Forbidden implicit state in src/cuda/:"
            echo "$HITS"
            exit 1
          fi
          echo "src/cuda/ is free of implicit state ✓"

      - name: cargo audit
        uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Version consistency check
        run: |
          CRATE=$(cargo metadata --no-deps --format-version=1 \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          WHEEL=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$CRATE" != "$WHEEL" ]; then
            echo "Version mismatch: Cargo.toml=$CRATE, pyproject.toml=$WHEEL"
            exit 1
          fi
          echo "Version: $CRATE ✓"

      # Discovered from cargo metadata rather than hardcoded: a new example
      # added in v0.2 would otherwise silently never run here.
      - name: Run all examples
        run: |
          # Skip examples gated behind features (e.g. required-features =
          # ["cuda"]) — the hosted runner has neither nvcc nor a GPU.
          EXAMPLES=$(cargo metadata --no-deps --format-version=1 \
            | python3 -c "import sys, json; print('\n'.join(sorted(t['name'] for p in json.load(sys.stdin)['packages'] for t in p['targets'] if 'example' in t['kind'] and not t.get('required-features'))))")
          if [ -z "$EXAMPLES" ]; then echo "no examples discovered"; exit 1; fi
          echo "$EXAMPLES" | while read -r ex; do
            echo "--- $ex ---"
            cargo run --example "$ex"
          done

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dev dependencies
        run: |
          uv venv .phaios-venv
          source .phaios-venv/bin/activate
          uv pip install -r requirements-dev.txt

      - name: Build Python extension
        run: |
          source .phaios-venv/bin/activate
          maturin develop

      - name: pytest
        run: |
          source .phaios-venv/bin/activate
          pytest tests/ffi.py -v

      - name: Type-check the stubs
        run: |
          source .phaios-venv/bin/activate
          mypy --strict python/phaios_core

      - name: stubtest
        run: |
          source .phaios-venv/bin/activate
          python -m mypy.stubtest phaios_core --allowlist tests/stubtest-allowlist.txt
