name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job reads the repository and nothing else, and says so itself.
# Every action is pinned to a commit, with its release tag in a comment,
# and no checkout leaves its token in the git config for later steps.
permissions: {}

# A newer push to the same branch or pull request makes an older run
# moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup is on the hosted image; the toolchain it installs is
      # whatever `stable` is that day.
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt,clippy
          rustup default stable
          rustc --version

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt
        run: cargo fmt --check

      # --all-targets so examples, benches and tests are linted too. Without
      # it, dead code in examples/shared/mod.rs slipped through CI.
      # --locked on every cargo command that resolves dependencies: the
      # committed Cargo.lock is what is tested, and a stale one fails
      # rather than being rewritten on the runner.
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked

      # Every function the extension imports from the platform libm is a
      # place where one wheel can give different bits on different
      # machines. tests/libm-imports.txt names each one and the kernels
      # that reach it; a new import (including one a compiler upgrade
      # introduces by rewriting a call) fails here until the ledger is
      # updated; the failure message asks for docs/ffi.md §6 to be
      # updated as well, which this step does not check.
      # The default build is checked: the cuda feature imports the same
      # set.
      - name: Platform libm imports match the ledger
        run: |
          cargo build --locked --release --lib
          bash scripts/libm-inventory.sh target/release/libphaios_core.so tests/libm-imports.txt

      # Kernels are pure functions and the CUDA backend holds
      # no implicit state — the device, stream and module cache live in a
      # Context the caller constructs and passes. Lines whose first
      # non-blank characters are `//` are skipped before matching:
      # context.rs documents the rule by naming the very constructs it
      # forbids ("There is no singleton, no `OnceLock`..."). Nothing else
      # is skipped; a line starting with `*` is code (`*o = ...`), and
      # src/ has no block comments.
      - name: No implicit state in the CUDA backend
        run: |
          HITS=$(grep -rnE 'static mut|OnceLock|OnceCell|lazy_static!|thread_local!' src/cuda/ \
                 | grep -vE '^[^:]*:[0-9]+:[[:space:]]*//' || true)
          if [ -n "$HITS" ]; then
            echo "Forbidden implicit state in src/cuda/:"
            echo "$HITS"
            exit 1
          fi
          echo "src/cuda/ is free of implicit state ✓"

      # CPU determinism (docs/ffi.md §6): no fused or algebraic float
      # operations, per-function target features, runtime CPU detection,
      # std::arch/core::arch SIMD intrinsics or ndarray matrix products in
      # src/, and no target-cpu/target-feature codegen flags in cargo
      # config, workflows or pyproject.toml, so each wheel computes at its
      # target's fixed default CPU (baseline x86-64 on Linux, x86-64 plus
      # SSE3/cmpxchg16b on Windows, Apple M1 on macOS) with no per-machine
      # dispatch. In src/ only `//` comment lines are skipped, the same
      # filter as the step above.
      - name: Determinism guards
        run: bash scripts/determinism-guards.sh

      - name: No image assets in the repository
        run: |
          # Sees tracked files, so it catches what .gitignore cannot: a
          # `git add -f` of a photograph (CONTRIBUTING.md, "Examples").
          # The one exception is the maintainer's test photographs, and
          # the checksum list in tools/kernel-viewer/testdata/README.md is
          # the allowlist: an image passes only if that list names it,
          # and every listed file must match its checksum. quotePath=false:
          # git C-quotes non-ASCII paths by default, and a quoted line ends
          # in `"`, which the extension pattern would never match.
          T=tools/kernel-viewer/testdata
          SUMS=$(grep -E '^[0-9a-f]{64}  [A-Za-z0-9._-]+$' "$T/README.md" || true)
          if [ -z "$SUMS" ]; then
            echo "No checksum list in $T/README.md"
            exit 1
          fi
          (cd "$T" && printf '%s\n' "$SUMS" | sha256sum --check --strict --quiet -)
          LISTED=$(printf '%s\n' "$SUMS" | sed "s#^[0-9a-f]*  #$T/#")
          HITS=$(git -c core.quotePath=false ls-files | grep -Ei '\.(dng|nef|cr2|cr3|arw|raf|orf|rw2|pef|srw|jpe?g|png|tiff?|webp|heic|heif|bmp|gif|exr|hdr|p[bgp]m|psd)$' | grep -vxF "$LISTED" || true)
          if [ -n "$HITS" ]; then
            echo "Image assets other than the listed test photographs are never committed (CONTRIBUTING.md):"
            echo "$HITS"
            exit 1
          fi
          echo "no image assets tracked beyond the listed test photographs, checksums match ✓"

      # The RustSec tool itself, a pinned release built from crates.io with
      # its own lockfile, so a new cargo-audit cannot change the gate
      # unannounced. It replaced `rustsec/audit-check`, whose last release
      # (v2.0.0, 2024) still declares the node20 runtime; its `v2` ref is a
      # branch frozen at that release, not a maintained floating tag.
      - name: cargo audit
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit

      - name: Version consistency check
        run: |
          CRATE=$(cargo metadata --locked --no-deps --format-version=1 \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          WHEEL=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$CRATE" != "$WHEEL" ]; then
            echo "Version mismatch: Cargo.toml=$CRATE, pyproject.toml=$WHEEL"
            exit 1
          fi
          echo "Version: $CRATE ✓"

      # Discovered from cargo metadata rather than hardcoded: a new example
      # added in v0.2 would otherwise silently never run here.
      - name: Run all examples
        run: |
          # Skip examples gated behind features (e.g. required-features =
          # ["cuda"]) — the hosted runner has neither nvcc nor a GPU.
          EXAMPLES=$(cargo metadata --locked --no-deps --format-version=1 \
            | python3 -c "import sys, json; print('\n'.join(sorted(t['name'] for p in json.load(sys.stdin)['packages'] for t in p['targets'] if 'example' in t['kind'] and not t.get('required-features'))))")
          if [ -z "$EXAMPLES" ]; then echo "no examples discovered"; exit 1; fi
          echo "$EXAMPLES" | while read -r ex; do
            echo "--- $ex ---"
            cargo run --locked --example "$ex"
          done

  # The bindings on every supported interpreter, 3.12 to 3.15. Each cell
  # compiles its own extension with `maturin develop` on its own
  # interpreter, so this tests the code on each version, not the promise
  # that one `cp312-abi3` wheel (`abi3-py312` in Cargo.toml) serves all of
  # them. That promise is tested by wheels.yml, which installs the very
  # wheel it built on 3.12 and on 3.15. Its own job rather than a matrix on
  # `test`: the Rust half above has nothing to do with the interpreter and
  # must not run once per interpreter.
  #
  # Free-threaded builds (3.14t, 3.15t) are deliberately absent: with only
  # `abi3-py312` enabled, PyO3 0.30 gives a free-threaded interpreter a
  # version-specific build rather than this wheel (PEP 803's `abi3t` would
  # need the `abi3t-py315` feature, which is not enabled), and PyO3 has not
  # supported 3.13t at all since 0.29. See README "Install".
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keyed per interpreter so the matrix jobs do not race for one
          # cache entry; `restore-keys` still warms them from `test`.
          key: ${{ runner.os }}-cargo-py${{ matrix.python }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Set up uv + Python ${{ matrix.python }}
        # setup-uv publishes full version tags only (no floating `v10`).
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install dev dependencies
        run: |
          uv venv .phaios-venv
          source .phaios-venv/bin/activate
          uv pip install -r requirements-dev.txt

      - name: Build Python extension
        run: |
          source .phaios-venv/bin/activate
          maturin develop --locked

      - name: pytest
        run: |
          source .phaios-venv/bin/activate
          pytest tests/ffi.py -v

      # The determinism harness: its selftest, then every kernel case run
      # twice, at the runner's default thread count and on one thread. The
      # two runs must give identical bytes, because a build is
      # bit-identical with itself at any thread count (docs/ffi.md §6).
      # On the debug build `maturin develop` makes, the pair takes seconds,
      # so the step runs on every interpreter.
      - name: Determinism harness
        run: |
          source .phaios-venv/bin/activate
          python scripts/kernel_digests.py selftest
          python scripts/kernel_digests.py run --strict --quiet --size 64 --out .cache/digests/default.jsonl
          RAYON_NUM_THREADS=1 python scripts/kernel_digests.py run --strict --quiet --size 64 --out .cache/digests/one-thread.jsonl
          python scripts/kernel_digests.py compare .cache/digests/default.jsonl .cache/digests/one-thread.jsonl --expect-identical

      - name: Type-check the stubs
        run: |
          source .phaios-venv/bin/activate
          mypy --strict python/phaios_core

      - name: stubtest
        run: |
          source .phaios-venv/bin/activate
          python -m mypy.stubtest phaios_core --allowlist tests/stubtest-allowlist.txt
