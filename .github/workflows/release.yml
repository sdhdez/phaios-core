name: Release

on:
  push:
    tags:
      # A final release only, vMAJOR.MINOR.PATCH. A pre-release tag such as
      # v0.2.0-rc1 does not match, so it never reaches either registry,
      # where an upload is permanent.
      - "v[0-9]+.[0-9]+.[0-9]+"

# Each job is granted what it needs and nothing more: `contents: read`
# to check out the repository, `id-token: write` only where PyPI's
# trusted publishing needs an OIDC token.
permissions: {}

jobs:
  # ── Gate ──────────────────────────────────────────────────────────────────
  #
  # Publishing is irreversible: neither PyPI nor crates.io lets a version be
  # re-uploaded. Nothing is built until the tag has been checked against the
  # versions in the tree and the test suite has passed on the tagged commit.

  verify:
    name: Verify tag and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt,clippy
          rustup default stable
          rustc --version

      - name: Tag matches Cargo.toml and pyproject.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE=$(cargo metadata --locked --no-deps --format-version=1 \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          WHEEL=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG crate=$CRATE wheel=$WHEEL"
          if [ "$TAG" != "$CRATE" ] || [ "$TAG" != "$WHEEL" ]; then
            echo "::error::version mismatch — tag $TAG, Cargo.toml $CRATE, pyproject.toml $WHEEL"
            exit 1
          fi

      - name: cargo fmt
        run: cargo fmt --check

      # --locked, as in ci.yml: the tagged Cargo.lock is what ships.
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked

      # The determinism checks from ci.yml (docs/ffi.md §6), repeated here
      # because a tag can be pushed on a commit CI never ran. As in ci.yml,
      # the libm ledger is checked against a native release build of the
      # tagged commit, not against the manylinux wheel built below.
      - name: Platform libm imports match the ledger
        run: |
          cargo build --locked --release --lib
          bash scripts/libm-inventory.sh target/release/libphaios_core.so tests/libm-imports.txt

      - name: Determinism guards
        run: bash scripts/determinism-guards.sh

      - name: No image assets in the repository
        run: |
          # Same guard as ci.yml: tracked files bypass .gitignore, and a
          # tag must never carry a photograph into either registry. The
          # listed test photographs are tracked but never packaged:
          # Cargo.toml's `exclude` drops tools/ and every image extension
          # from the crate and the sdist, and .gitattributes from source
          # archives. The allowlist and quotePath=false: see ci.yml.
          T=tools/kernel-viewer/testdata
          SUMS=$(grep -E '^[0-9a-f]{64}  [A-Za-z0-9._-]+$' "$T/README.md" || true)
          if [ -z "$SUMS" ]; then
            echo "::error::no checksum list in $T/README.md"
            exit 1
          fi
          (cd "$T" && printf '%s\n' "$SUMS" | sha256sum --check --strict --quiet -)
          LISTED=$(printf '%s\n' "$SUMS" | sed "s#^[0-9a-f]*  #$T/#")
          HITS=$(git -c core.quotePath=false ls-files | grep -Ei '\.(dng|nef|cr2|cr3|arw|raf|orf|rw2|pef|srw|jpe?g|png|tiff?|webp|heic|heif|bmp|gif|exr|hdr|p[bgp]m|psd)$' | grep -vxF "$LISTED" || true)
          if [ -n "$HITS" ]; then
            echo "::error::image assets other than the listed test photographs are never committed (CONTRIBUTING.md):"
            echo "$HITS"
            exit 1
          fi
          echo "no image assets tracked beyond the listed test photographs, checksums match ✓"

  # ── Build and smoke-test ──────────────────────────────────────────────────
  #
  # wheels.yml builds the three wheels and the sdist, installs each into a
  # clean environment on its own OS (Python 3.12 and 3.15) and runs
  # scripts/wheel-smoke.sh, builds the sdist from source the same way, and
  # checks the SBOMs. This job succeeds only if every one of those jobs
  # did, and its artefacts are the ones published below. A job that calls
  # a reusable workflow cannot set timeout-minutes; each job inside
  # wheels.yml sets its own.

  wheels:
    name: Wheels
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/wheels.yml

  # ── Publish ───────────────────────────────────────────────────────────────
  #
  # PyPI first, then crates.io: publish-crates waits for publish-pypi, so a
  # failed PyPI upload leaves crates.io untouched. Both refuse to run on
  # anything but a tag, whatever trigger is added above in future.

  publish-pypi:
    name: Publish to PyPI
    needs: wheels
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/phaios-core
    permissions:
      id-token: write  # OIDC trusted publishing — no token stored in secrets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      # Nothing is uploaded unless all four files are here: a release
      # missing one platform's wheel is a release that platform's users
      # build from source.
      - name: Three wheels and one sdist
        run: |
          shopt -s nullglob
          WHEELS=(dist/*.whl) SDISTS=(dist/*.tar.gz)
          ls -l dist
          if [ "${#WHEELS[@]}" -ne 3 ] || [ "${#SDISTS[@]}" -ne 1 ]; then
            echo "::error::expected 3 wheels and 1 sdist in dist/, found ${#WHEELS[@]} and ${#SDISTS[@]}"
            exit 1
          fi
      # skip-existing: "Re-run failed jobs" re-runs this job with the same
      # artefacts, and without the flag every file a failed attempt had
      # already uploaded would fail the re-run. Kept for 0.2.0; the
      # post-release check that PyPI lists all four files covers a partial
      # upload.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  publish-crates:
    name: Publish to crates.io
    needs: publish-pypi
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
