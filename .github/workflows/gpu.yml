# SPDX-License-Identifier: GPL-3.0-or-later
#
# The half of CI that a hosted runner cannot do.
#
# `ci.yml` runs on ubuntu-latest, which has neither nvcc nor an NVIDIA
# device, so it deliberately skips every target gated behind
# `required-features = ["cuda"]` and never builds the CUDA backend at all.
# This workflow is its mirror image and runs only on a self-hosted runner
# that has both.
#
# It is not required for a release — `release.yml` does not depend on it,
# and the published wheels are built without the feature. It exists so
# that a contributor with a device can run the verification on GitHub as
# well as by hand.
#
# It runs only when started by hand (Actions, GPU, Run workflow; or
# `gh workflow run gpu.yml`). No runner with the `cuda` label exists, and
# a job no runner can take waits in the queue until GitHub cancels it
# (after 24 hours), so the triggers it used to have queued one on every
# push to main or a feat/ branch and on every pull request. Until a runner
# exists, verify the backend with ./scripts/gpu-verify.sh on a machine
# with a device.
#
# Setting up a runner: https://docs.github.com/actions/hosting-your-own-runners
# Label it `cuda` and it will pick these jobs up. If a pull_request trigger
# ever returns, fork pull requests still do not run here — see the `if`
# guard below; a self-hosted runner executes arbitrary code from whoever
# opened the PR, so this is deliberate.

name: GPU

on:
  workflow_dispatch:

# The one job reads the repository and nothing else.
permissions: {}

jobs:
  cuda:
    name: CUDA backend (self-hosted)
    runs-on: [self-hosted, cuda]
    # Never run untrusted fork code on a self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain and device
        run: |
          rustc --version
          nvcc --version | tail -2
          nvidia-smi --query-gpu=name,driver_version --format=csv,noheader

      # One script, so the local command and the CI job cannot drift apart:
      # whatever a contributor runs by hand is exactly what runs here.
      - name: Verify
        run: ./scripts/gpu-verify.sh
